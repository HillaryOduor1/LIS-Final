    <!-- ==============================================
         CRITICAL: THEME SCRIPT — runs synchronously
         before any paint. Prevents white/dark flash.
    ================================================== -->
    <script>
      (function () {
        var KEY = 'theme';
        var BG_DARK = '#102219';
        var BG_LIGHT = '#f6f8f7';
        var theme, resolved;
        try {
          theme = localStorage.getItem(KEY);
          theme = (theme === 'light' || theme === 'dark') ? theme : 'system';
          resolved =
            theme === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.backgroundColor =
            resolved === 'dark' ? BG_DARK : BG_LIGHT;
        } catch (_) {
          resolved = 'light';
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = BG_LIGHT;
        }

        // ==============================================
        // FAVICON FALLBACK – ES5 compatible
        // Updates favicon links if the browser doesn't
        // honour the `media` attribute on `<link>`.
        // Also updates when theme changes (listener below).
        // ==============================================
        function setFavicon(theme) {
          var basePath = theme === 'dark' ? '/dark-mode-favicon/' : '/light-mode-favicon/';
          var links = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
          for (var i = 0; i < links.length; i++) {
            var link = links[i];
            // Only update links that have a `media` attribute (we added them below)
            if (link.hasAttribute('media')) {
              var filename = link.getAttribute('href').split('/').pop();
              link.href = basePath + filename;
            }
          }
        }

        // Set favicon immediately based on resolved theme
        setFavicon(resolved);

        // Listen for system preference changes (optional)
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addListener(function (e) {
            // If user hasn't overridden, update favicon
            var stored = localStorage.getItem(KEY);
            if (!stored || stored === 'system') {
              var newTheme = e.matches ? 'dark' : 'light';
              setFavicon(newTheme);
            }
          });
        }

        // Also listen for manual theme changes (if you have a toggle)
        // This custom event can be dispatched from your app.
        document.addEventListener('themeChanged', function (e) {
          var newTheme = e.detail && e.detail.theme ? e.detail.theme : 'light';
          setFavicon(newTheme);
        });
      })();
    </script>
