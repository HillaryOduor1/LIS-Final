    <!-- CRITICAL: THEME SCRIPT — runs synchronously  before any paint. Prevents white/dark flash.-->
    <script>
      (function () {
        var KEY = 'theme';
        var BG_DARK = '#0D2418';
        var BG_LIGHT = '#F6F8F7';
        var theme, resolved;
        try {
          theme = localStorage.getItem(KEY);
          theme = (theme === 'light' || theme === 'dark') ? theme : 'system';
          resolved =
            theme === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          // Set direct background color for immediate flash prevention
          document.documentElement.style.backgroundColor =
            resolved === 'dark' ? BG_DARK : BG_LIGHT;
          document.documentElement.style.color =
            resolved === 'dark' ? '#F6F8F7' : '#123524';
        } catch (_) {
          resolved = 'light';
          document.documentElement.classList.add('light');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.backgroundColor = BG_LIGHT;
          document.documentElement.style.color = '#123524';
        }

        /* FAVICON FALLBACK – ES5 compatible,Updates favicon links if the browser doesn't honour the `media` attribute on `<link>`.Also updates when theme changes (listener below).*/
        function setFavicon(theme) {
          var basePath = theme === 'dark' ? '/dark-mode-favicon/' : '/light-mode-favicon/';
          var links = document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]');
          for (var i = 0; i < links.length; i++) {
            var link = links[i];
            if (link.hasAttribute('media')) {
              var filename = link.getAttribute('href').split('/').pop();
              link.href = basePath + filename;
            }
          }
        }

        setFavicon(resolved);

        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addListener(function (e) {
            var stored = localStorage.getItem(KEY);
            if (!stored || stored === 'system') {
              var newTheme = e.matches ? 'dark' : 'light';
              setFavicon(newTheme);
            }
          });
        }

        document.addEventListener('themeChanged', function (e) {
          var newTheme = e.detail && e.detail.theme ? e.detail.theme : 'light';
          setFavicon(newTheme);
        });

        /* MANIFEST THEME SWITCHING,Updates manifest link when theme changes */ 
        function setManifest(theme) {
          var manifestPath = theme === 'dark' 
            ? '/dark-mode-favicon/site.webmanifest' 
            : '/light-mode-favicon/site.webmanifest';
          
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.href = manifestPath;
          } else {
            var link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestPath;
            document.head.appendChild(link);
          }
        }

        // Set initial manifest
        setManifest(resolved);

        // Listen for theme changes
        document.addEventListener('themeChanged', function (e) {
          var newTheme = e.detail && e.detail.theme ? e.detail.theme : 'light';
          setManifest(newTheme);
        });

        // Also listen for system preference changes
        if (window.matchMedia) {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          mq.addListener(function (e) {
            var stored = localStorage.getItem(KEY);
            if (!stored || stored === 'system') {
              var newTheme = e.matches ? 'dark' : 'light';
              setManifest(newTheme);
            }
          });
        }
      })();
    </script>
